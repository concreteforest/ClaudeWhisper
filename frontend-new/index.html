<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src ws://localhost:12393;" />
  <title>ClaudeWhisper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #e8e8e8;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: rgba(15, 15, 20, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }

    /* ---- titlebar ---- */
    #titlebar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      -webkit-app-region: drag;
      cursor: default;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      user-select: none;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    #status-label {
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.03em;
      flex: 1;
    }

    #mute-btn {
      font-size: 13px;
      line-height: 1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      -webkit-app-region: no-drag;
      opacity: 0.55;
      transition: opacity 0.15s;
    }
    #mute-btn:hover { opacity: 1; }
    #mute-btn.muted  { opacity: 1; }

    #mic-btn {
      font-size: 13px;
      line-height: 1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      -webkit-app-region: no-drag;
      opacity: 0.55;
      transition: opacity 0.15s, background 0.15s;
    }
    #mic-btn:hover { opacity: 1; }
    #mic-btn.mic-muted {
      opacity: 1;
      background: rgba(239, 68, 68, 0.25);
    }

    /* ---- message history ---- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 1px;
      max-width: 92%;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg-label {
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.4;
    }

    .msg-body {
      font-size: 12px;
    }

    /* User messages — right side */
    .msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg.user .msg-body {
      background: rgba(255,255,255,0.1);
      border-radius: 10px 10px 2px 10px;
      padding: 5px 9px;
      color: rgba(255,255,255,0.85);
    }

    /* AI messages — left side */
    .msg.ai {
      align-self: flex-start;
      align-items: flex-start;
    }
    .msg.ai .msg-body {
      color: rgba(255,255,255,0.9);
      padding: 2px 0;
    }
    .msg.ai.thinking .msg-body {
      color: rgba(255,255,255,0.35);
      font-style: italic;
    }

    #error-banner {
      display: none;
      font-size: 11px;
      color: #f87171;
      padding: 3px 10px;
      flex-shrink: 0;
    }

    /* ---- input area ---- */
    #input-area {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    #text-input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
      transition: border-color 0.15s;
    }
    #text-input::placeholder { color: rgba(255,255,255,0.28); }
    #text-input:focus { border-color: rgba(255,255,255,0.28); }

    #send-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: background 0.15s;
    }
    #send-btn:hover { background: rgba(255,255,255,0.18); }
    #send-btn:active { background: rgba(255,255,255,0.08); }

    /* state-driven dot colors */
    body.state-idle      #status-dot { background: #555; }
    body.state-listening #status-dot { background: #ef4444; }
    body.state-thinking  #status-dot { background: #f59e0b; }
    body.state-speaking  #status-dot { background: #22c55e; }
    body.state-error     #status-dot { background: #ef4444; }
  </style>
</head>
<body class="state-idle">
  <div id="app">
    <div id="titlebar">
      <span id="status-dot"></span>
      <span id="status-label">Ready</span>
      <button id="mic-btn" title="Toggle mic">🎙️</button>
      <button id="mute-btn" title="Toggle mute">🔊</button>
    </div>
    <div id="messages"></div>
    <div id="error-banner"></div>
    <div id="input-area">
      <input id="text-input" type="text" placeholder="Type a message…" autocomplete="off" spellcheck="false" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------------------
    // DOM references
    // -------------------------------------------------------------------------
    const $statusLabel = document.getElementById('status-label');
    const $messages    = document.getElementById('messages');
    const $errorBanner = document.getElementById('error-banner');
    const $textInput   = document.getElementById('text-input');
    const $sendBtn     = document.getElementById('send-btn');
    const $muteBtn     = document.getElementById('mute-btn');
    const $micBtn      = document.getElementById('mic-btn');

    // -------------------------------------------------------------------------
    // State machine
    // -------------------------------------------------------------------------
    const STATE_LABELS = {
      idle:      'Ready',
      listening: 'Listening…',
      thinking:  'Thinking…',
      speaking:  'Speaking…',
      error:     'Error',
    };

    let currentState = 'idle';

    function setState(s) {
      currentState = s;
      document.body.className = 'state-' + s;
      $statusLabel.textContent = STATE_LABELS[s] ?? s;
    }

    // -------------------------------------------------------------------------
    // Chat history
    // -------------------------------------------------------------------------
    let currentAiEl    = null;  // the .msg.ai element being built this turn
    let inConversation = false; // true between conversation-chain-start and -end

    function scrollToBottom() {
      $messages.scrollTop = $messages.scrollHeight;
    }

    function addUserMessage(text) {
      if (!text) return;
      const el = document.createElement('div');
      el.className = 'msg user';
      el.innerHTML = '<span class="msg-label">You</span><span class="msg-body"></span>';
      el.querySelector('.msg-body').textContent = text;
      $messages.appendChild(el);
      scrollToBottom();
    }

    function startAiMessage() {
      currentAiEl = document.createElement('div');
      currentAiEl.className = 'msg ai thinking';
      currentAiEl.innerHTML = '<span class="msg-label">Claude</span><span class="msg-body">Thinking…</span>';
      $messages.appendChild(currentAiEl);
      scrollToBottom();
    }

    function appendAiText(text) {
      if (!text) return;
      if (!currentAiEl) startAiMessage(); // auto-create if text input (no transcription step)
      const body = currentAiEl.querySelector('.msg-body');
      if (currentAiEl.classList.contains('thinking')) {
        // First real content — replace placeholder
        currentAiEl.classList.remove('thinking');
        body.textContent = text;
      } else {
        body.textContent += ' ' + text;
      }
      scrollToBottom();
    }

    function finalizeAiMessage() {
      currentAiEl = null;
    }

    // -------------------------------------------------------------------------
    // Mute
    // -------------------------------------------------------------------------
    let muted         = false;
    let micMuted      = false;
    let currentSource = null; // active AudioBufferSourceNode, if any

    $muteBtn.addEventListener('click', () => {
      muted = !muted;
      $muteBtn.textContent = muted ? '🔇' : '🔊';
      $muteBtn.classList.toggle('muted', muted);
      if (muted && currentSource) {
        try { currentSource.stop(); } catch (_e) {}
        currentSource = null;
      }
    });

    $micBtn.addEventListener('click', () => {
      micMuted = !micMuted;
      $micBtn.classList.toggle('mic-muted', micMuted);
      if (micMuted) {
        stopMicStreaming();
      } else if (currentState === 'idle') {
        startMicStreaming();
      }
    });

    // -------------------------------------------------------------------------
    // Audio playback queue
    // -------------------------------------------------------------------------
    let audioQueue    = [];
    let audioPlaying  = false;
    let synthComplete = false;
    let audioCtx      = null;

    function getAudioCtx() {
      if (!audioCtx || audioCtx.state === 'closed') {
        audioCtx = new AudioContext({ sampleRate: 44100 });
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function sendPlaybackComplete() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'frontend-playback-complete' }));
      }
    }

    function checkDrainComplete() {
      if (synthComplete && audioQueue.length === 0 && !audioPlaying) {
        synthComplete = false;
        sendPlaybackComplete();
      }
    }

    async function drainAudioQueue() {
      if (audioPlaying || audioQueue.length === 0) return;
      audioPlaying = true;

      while (audioQueue.length > 0) {
        const { audio } = audioQueue.shift();
        setState('speaking');

        if (audio && !muted) {
          await new Promise((resolve) => {
            try {
              const raw = atob(audio);
              const buf = new Uint8Array(raw.length);
              for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
              getAudioCtx().decodeAudioData(buf.buffer, (decoded) => {
                const src = getAudioCtx().createBufferSource();
                src.buffer = decoded;
                src.connect(getAudioCtx().destination);
                currentSource = src;
                src.onended = () => { currentSource = null; resolve(); };
                src.start();
              }, () => resolve());
            } catch (_e) { resolve(); }
          });
        }
      }

      audioPlaying = false;
      checkDrainComplete();
    }

    // -------------------------------------------------------------------------
    // WebSocket
    // -------------------------------------------------------------------------
    let ws = null;

    function connect() {
      ws = new WebSocket('ws://localhost:12393/client-ws');

      ws.addEventListener('open', () => {
        $errorBanner.style.display = 'none';
        setState('idle');
        ws.send(JSON.stringify({ type: 'create-new-history' }));
        startMicStreaming();
      });

      ws.addEventListener('message', (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch (_e) { return; }
        handleMessage(msg);
      });

      ws.addEventListener('close', () => {
        stopMicStreaming();
        setTimeout(connect, 3000);
      });

      ws.addEventListener('error', () => ws.close());
    }

    // -------------------------------------------------------------------------
    // Message handler
    // -------------------------------------------------------------------------
    function handleMessage(msg) {
      switch (msg.type) {
        case 'control':
          handleControl(msg.text);
          break;

        case 'backend-synth-complete':
          // Top-level type (NOT a control subtype)
          synthComplete = true;
          checkDrainComplete();
          break;

        case 'user-input-transcription':
          // Voice input — user bubble first, then AI bubble in correct order
          addUserMessage(msg.text);
          startAiMessage();
          break;

        case 'audio': {
          const text = msg.display_text?.text ?? '';
          appendAiText(text);
          audioQueue.push({ audio: msg.audio });
          drainAudioQueue();
          break;
        }

        case 'error':
          $errorBanner.textContent = msg.message ?? 'An error occurred';
          $errorBanner.style.display = 'block';
          setState('error');
          break;

        case 'full-text':
          // During a normal turn this arrives as "Thinking..." — ignore it,
          // we get real text from audio display_text chunks instead.
          // For standalone commands (folder-switch), inConversation is false
          // so we show the result as a Claude bubble.
          if (!inConversation && msg.text) {
            if (!currentAiEl) startAiMessage();
            appendAiText(msg.text);
          }
          break;

        // live2d, group, force-new-message — ignored
        default:
          break;
      }
    }

    function handleControl(text) {
      switch (text) {
        case 'conversation-chain-start':
          inConversation = true;
          synthComplete  = false;
          audioQueue     = [];
          audioPlaying   = false;
          setState('thinking');
          stopMicStreaming();
          // Don't create AI bubble yet — for voice, user-input-transcription arrives
          // next and creates it in the right order. For text input, appendAiText
          // auto-creates it on the first audio chunk (after user bubble already exists).
          break;

        case 'start-mic':
          setState('idle');
          startMicStreaming();
          break;

        case 'conversation-chain-end':
          inConversation = false;
          finalizeAiMessage();
          setState('idle');
          startMicStreaming();
          break;

        default:
          break;
      }
    }

    // -------------------------------------------------------------------------
    // Mic recording with silence detection
    // -------------------------------------------------------------------------
    const SILENCE_RMS = 0.012;
    const SILENCE_MS  = 1500;

    let micStream    = null;
    let micCtx       = null;
    let processor    = null;
    let speechActive = false;
    let silenceTimer = null;

    function stopMicStreaming() {
      if (processor)    { processor.disconnect(); processor = null; }
      if (micCtx)       { micCtx.close().catch(() => {}); micCtx = null; }
      if (micStream)    { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      speechActive = false;
    }

    async function startMicStreaming() {
      if (micMuted) return;
      if (micStream) return;

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (_e) {
        $errorBanner.textContent = 'Microphone access denied';
        $errorBanner.style.display = 'block';
        return;
      }

      micCtx = new AudioContext();
      const source    = micCtx.createMediaStreamSource(micStream);
      const processor = micCtx.createScriptProcessor(4096, 1, 1);
      source.connect(processor);
      processor.connect(micCtx.destination);

      const decimation = micCtx.sampleRate / 16000;

      processor.onaudioprocess = (evt) => {
        const input  = evt.inputBuffer.getChannelData(0);
        const outLen = Math.floor(input.length / decimation);
        const out    = new Float32Array(outLen);
        let sumSq    = 0;
        for (let i = 0; i < outLen; i++) {
          const s = input[Math.floor(i * decimation)];
          out[i]  = s;
          sumSq  += s * s;
        }
        const rms = Math.sqrt(sumSq / outLen);

        // Stream to backend
        if (ws && ws.readyState === WebSocket.OPEN) {
          for (let off = 0; off < outLen; off += 4096) {
            const slice = out.slice(off, Math.min(off + 4096, outLen));
            ws.send(JSON.stringify({ type: 'mic-audio-data', audio: Array.from(slice) }));
          }
        }

        // Silence detection
        if (rms >= SILENCE_RMS) {
          speechActive = true;
          if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
          if (currentState === 'idle') setState('listening');
        } else if (speechActive && !silenceTimer) {
          silenceTimer = setTimeout(() => {
            silenceTimer  = null;
            speechActive  = false;
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'mic-audio-end' }));
            }
            setState('thinking');
            stopMicStreaming();
          }, SILENCE_MS);
        }
      };
    }

    // -------------------------------------------------------------------------
    // Text input
    // -------------------------------------------------------------------------
    function sendTextInput() {
      const text = $textInput.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      $textInput.value = '';
      addUserMessage(text);   // show immediately in history
      stopMicStreaming();
      setState('thinking');
      ws.send(JSON.stringify({ type: 'text-input', text }));
    }

    $sendBtn.addEventListener('click', sendTextInput);
    $textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTextInput(); }
    });

    // -------------------------------------------------------------------------
    // Boot
    // -------------------------------------------------------------------------
    connect();
  </script>
</body>
</html>
